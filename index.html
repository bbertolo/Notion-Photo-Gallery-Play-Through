<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #17181a;
    --stage: #101113;
    --ink: #ecebe7;
    --muted: #9a9a96;
    --line: #2c2d30;
    --hover: #232427;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Empty state ---------- */
  #empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    border: 1.5px dashed var(--line);
    margin: 20px;
    border-radius: 10px;
    transition: border-color .15s, background-color .15s;
  }
  #empty.dragover { border-color: var(--muted); background: var(--hover); }
  #empty h1 { font-size: 19px; font-weight: 500; margin: 0; letter-spacing: .01em; }
  #empty p { margin: 0; color: var(--muted); max-width: 34ch; line-height: 1.5; }
  button {
    font: inherit;
    color: var(--ink);
    background: var(--hover);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 18px;
    cursor: pointer;
  }
  button:hover { background: #2b2c30; }
  button:focus-visible, .thumb:focus-visible, .navbtn:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  /* ---------- Viewer ---------- */
  #viewer { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #viewer.active { display: flex; }

  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    gap: 12px;
  }
  #counter { color: var(--muted); font-variant-numeric: tabular-nums; }
  #caption {
    flex: 1;
    text-align: center;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  #addmore { padding: 6px 12px; font-size: 14px; }
  .movebtn {
    padding: 6px 10px;
    font-size: 14px;
    line-height: 1;
  }
  .movebtn:disabled { opacity: .35; cursor: default; }
  .thumb.dropside-left { border-left-color: var(--ink); }
  .thumb.dropside-right { border-right-color: var(--ink); }

  #stage {
    flex: 1;
    min-height: 0;
    position: relative;
    background: var(--stage);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: pan-y;
  }
  #photo {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }
  .navbtn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(23, 24, 26, .55);
    border: none;
    border-radius: 8px;
    color: var(--ink);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .navbtn:hover { background: rgba(23, 24, 26, .85); }
  #prev { left: 10px; }
  #next { right: 10px; }

  #captionbar {
    flex: none;
    padding: 10px 16px 0;
  }
  #captioninput {
    width: 100%;
    font: inherit;
    text-align: center;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    padding: 6px 8px;
    outline: none;
  }
  #captioninput::placeholder { color: var(--muted); }
  #captioninput:hover { border-bottom-color: var(--line); }
  #captioninput:focus { border-bottom-color: var(--muted); }

  #strip {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    flex: none;
  }
  .thumbwrap { position: relative; flex: none; }
  .thumb {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid transparent;
    padding: 0;
    background: var(--stage);
    cursor: pointer;
    opacity: .55;
    transition: opacity .15s;
    display: block;
  }
  .del {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--muted);
    font-size: 12px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .del:hover { color: var(--ink); border-color: var(--muted); }
  #notice {
    display: none;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 0 16px 8px;
  }
  #notice.show { display: block; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.current { border-color: var(--ink); opacity: 1; }
  .thumb:hover { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (max-width: 480px) {
    .navbtn { width: 38px; height: 54px; font-size: 20px; }
    .thumb { width: 46px; height: 46px; }
  }
</style>
</head>
<body>

<input type="file" id="picker" accept="image/*" multiple hidden>

<div id="empty">
  <h1>Photo viewer</h1>
  <p>Add photos from your device, then click or swipe through them. Photos are saved in this browser only — nothing is uploaded anywhere.</p>
  <button id="pick">Add photos</button>
  <p>You can also drag and drop images here.</p>
</div>

<div id="viewer">
  <div id="topbar">
    <span id="counter">1 / 1</span>
    <span id="caption"></span>
    <button class="movebtn" id="moveleft" title="Move this photo earlier" aria-label="Move this photo earlier">&#8249;&#8249;</button>
    <button class="movebtn" id="moveright" title="Move this photo later" aria-label="Move this photo later">&#8250;&#8250;</button>
    <button id="addmore">Add photos</button>
  </div>
  <div id="stage">
    <img id="photo" alt="">
    <button class="navbtn" id="prev" aria-label="Previous photo">&#8249;</button>
    <button class="navbtn" id="next" aria-label="Next photo">&#8250;</button>
  </div>
  <div id="captionbar">
    <input id="captioninput" type="text" placeholder="Add a caption…" maxlength="200" aria-label="Photo caption">
  </div>
  <div id="strip" role="tablist" aria-label="Photo thumbnails"></div>
  <div id="notice"></div>
</div>

<script>
(function () {
  var photos = [];      // { src, name, caption }
  var index = 0;
  var dragFrom = null;

  var empty = document.getElementById("empty");
  var viewer = document.getElementById("viewer");
  var picker = document.getElementById("picker");
  var photo = document.getElementById("photo");
  var counter = document.getElementById("counter");
  var caption = document.getElementById("caption");
  var strip = document.getElementById("strip");
  var captionInput = document.getElementById("captioninput");
  var notice = document.getElementById("notice");

  var STORAGE_KEY = "photo-viewer-gallery";
  var saveTimer = null;

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
        notice.classList.remove("show");
      } catch (err) {
        notice.textContent = "Storage is full — this change won't survive a reload. Remove a photo or two to make room.";
        notice.classList.add("show");
      }
    }, 400);
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) {
        photos = parsed;
        index = 0;
        render();
      }
    } catch (err) { /* corrupt or unavailable storage: start fresh */ }
  }

  // Downscale to keep localStorage happy while staying sharp in an embed
  function shrink(dataUrl, done) {
    var img = new Image();
    img.onload = function () {
      var MAX = 1600;
      var w = img.width, h = img.height;
      if (w <= MAX && h <= MAX) { done(dataUrl); return; }
      var scale = MAX / Math.max(w, h);
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      done(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = function () { done(dataUrl); };
    img.src = dataUrl;
  }

  captionInput.addEventListener("input", function () {
    if (photos[index]) { photos[index].caption = captionInput.value; save(); }
  });
  captionInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") captionInput.blur();
  });

  function readFiles(fileList) {
    var files = Array.prototype.filter.call(fileList, function (f) {
      return f.type.indexOf("image/") === 0;
    });
    if (!files.length) return;
    var pending = files.length;
    files.forEach(function (file) {
      var reader = new FileReader();
      reader.onload = function () {
        shrink(reader.result, function (small) {
          photos.push({ src: small, name: file.name.replace(/\.[^.]+$/, "") });
          if (--pending === 0) {
            index = photos.length - files.length; // jump to first newly added
            render();
            save();
          }
        });
      };
      reader.onerror = function () {
        if (--pending === 0) { render(); save(); }
      };
      reader.readAsDataURL(file);
    });
  }

  function render() {
    if (!photos.length) return;
    empty.style.display = "none";
    viewer.classList.add("active");

    var p = photos[index];
    photo.src = p.src;
    photo.alt = p.name;
    caption.textContent = p.name;
    counter.textContent = (index + 1) + " / " + photos.length;
    captionInput.value = p.caption || "";

    strip.innerHTML = "";
    photos.forEach(function (item, i) {
      var wrap = document.createElement("div");
      wrap.className = "thumbwrap";

      var b = document.createElement("button");
      b.className = "thumb" + (i === index ? " current" : "");
      b.setAttribute("aria-label", "Show photo " + (i + 1) + " (drag to reorder)");
      b.draggable = true;
      var img = document.createElement("img");
      img.src = item.src;
      img.alt = "";
      b.appendChild(img);
      b.addEventListener("click", function () { index = i; render(); });

      b.addEventListener("dragstart", function (e) {
        dragFrom = i;
        if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
      });
      b.addEventListener("dragover", function (e) {
        e.preventDefault();
        var before = e.offsetX < b.offsetWidth / 2;
        b.classList.toggle("dropside-left", before);
        b.classList.toggle("dropside-right", !before);
      });
      b.addEventListener("dragleave", function () {
        b.classList.remove("dropside-left", "dropside-right");
      });
      b.addEventListener("drop", function (e) {
        e.preventDefault();
        b.classList.remove("dropside-left", "dropside-right");
        if (dragFrom === null) return;
        var before = e.offsetX < b.offsetWidth / 2;
        var to = before ? i : i + 1;
        if (dragFrom < to) to--;
        move(dragFrom, to);
        dragFrom = null;
      });
      b.addEventListener("dragend", function () { dragFrom = null; });

      var del = document.createElement("button");
      del.className = "del";
      del.textContent = "\u00d7";
      del.setAttribute("aria-label", "Remove photo " + (i + 1));
      del.title = "Remove photo";
      del.addEventListener("click", function (e) {
        e.stopPropagation();
        removeAt(i);
      });

      wrap.appendChild(b);
      wrap.appendChild(del);
      strip.appendChild(wrap);
    });
    document.getElementById("moveleft").disabled = index === 0;
    document.getElementById("moveright").disabled = index === photos.length - 1;
    var current = strip.children[index];
    if (current && current.scrollIntoView) {
      current.scrollIntoView({ block: "nearest", inline: "center" });
    }
  }

  function step(delta) {
    if (!photos.length) return;
    index = (index + delta + photos.length) % photos.length;
    render();
  }

  document.getElementById("pick").addEventListener("click", function () { picker.click(); });
  document.getElementById("addmore").addEventListener("click", function () { picker.click(); });
  picker.addEventListener("change", function () {
    readFiles(picker.files);
    picker.value = "";
  });

  function move(from, to) {
    if (from === to || to < 0 || to >= photos.length) return;
    var item = photos.splice(from, 1)[0];
    photos.splice(to, 0, item);
    index = to;
    render();
    save();
  }

  function removeAt(i) {
    photos.splice(i, 1);
    if (index >= photos.length) index = Math.max(0, photos.length - 1);
    if (!photos.length) {
      viewer.classList.remove("active");
      empty.style.display = "";
      try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
      return;
    }
    render();
    save();
  }

  document.getElementById("moveleft").addEventListener("click", function () { move(index, index - 1); });
  document.getElementById("moveright").addEventListener("click", function () { move(index, index + 1); });

  document.getElementById("prev").addEventListener("click", function () { step(-1); });
  document.getElementById("next").addEventListener("click", function () { step(1); });

  document.addEventListener("keydown", function (e) {
    if (e.target === captionInput) return;
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });

  // Drag and drop
  ["dragover", "dragenter"].forEach(function (ev) {
    empty.addEventListener(ev, function (e) { e.preventDefault(); empty.classList.add("dragover"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    empty.addEventListener(ev, function (e) { e.preventDefault(); empty.classList.remove("dragover"); });
  });
  empty.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files) readFiles(e.dataTransfer.files);
  });

  // Swipe on the stage (mobile / Notion mobile embeds)
  var touchX = null;
  var stage = document.getElementById("stage");
  stage.addEventListener("touchstart", function (e) {
    touchX = e.changedTouches[0].clientX;
  }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
    touchX = null;
  }, { passive: true });

  load();
})();
</script>
</body>
</html>
